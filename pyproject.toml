[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-intelligence-workbench"
version = "0.7.0"
description = "Local-first academic paper registry, note, claim, BibTeX, and citation-audit workbench."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "paper-intelligence-workbench contributors"}
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
paperwb = "paper_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["paper_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
