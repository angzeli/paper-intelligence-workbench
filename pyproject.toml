[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-intelligence-workbench"
version = "1.8.0"
description = "Local-first academic paper registry, note, claim, BibTeX, and citation-audit workbench."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "paper-intelligence-workbench contributors"}
]
keywords = ["academic", "bibtex", "literature-review", "local-first", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Homepage = "https://github.com/angzeli/paper-intelligence-workbench"
Documentation = "https://github.com/angzeli/paper-intelligence-workbench/tree/main/docs"
Repository = "https://github.com/angzeli/paper-intelligence-workbench"

[project.scripts]
paperwb = "paper_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["paper_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
