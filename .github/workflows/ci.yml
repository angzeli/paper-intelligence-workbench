name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import package
        run: python -c "import paper_workbench; print(paper_workbench.__version__)"

      - name: CLI smoke test
        run: |
          python -m paper_workbench.cli --help
          paperwb --help

      - name: Clean-room install check
        run: python scripts/clean_room_install_check.py --quick --out /tmp/paperwb_clean_room_check.md

      - name: Release quality gate
        run: python scripts/run_quality_gate.py release --out scratch/ci_quality_gate.md
